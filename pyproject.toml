[project]
name = "mini-sag-wiki"
version = "0.1.0"
description = "JEV-gated BM25 wiki retrieval CLI for AI agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
mini_sag_wiki = "mini_sag_wiki.cli:main"
wiki = "mini_sag_wiki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mini_sag_wiki"]
